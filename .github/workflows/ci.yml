name: ci
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm demo
      - run: pnpm demo:night-watch
      - run: pnpm demo:sub-hire
      - run: pnpm demo:clearing
      - run: pnpm demo:refund
