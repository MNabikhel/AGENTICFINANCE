name: ci
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm demo
      - run: pnpm demo:night-watch
      - run: pnpm demo:sub-hire
      - run: pnpm demo:clearing
      - run: pnpm demo:refund
      - run: pnpm demo:replay
      - run: pnpm demo:nonce
      - run: pnpm demo:deny
      - run: pnpm demo:recurrence
      - run: pnpm demo:calendar
      - run: pnpm demo:slot
      - run: pnpm demo:daily
      - run: pnpm demo:cart
      - run: pnpm demo:velocity
      - run: pnpm demo:door
      - run: pnpm demo:match
      - run: pnpm demo:room
      - run: pnpm demo:conversion
      - run: pnpm demo:pair
      - run: pnpm demo:band
      - run: pnpm demo:nest
      - run: pnpm demo:heir
      - run: pnpm demo:stock
      - run: pnpm demo:purse
      - run: pnpm demo:seat
      - run: pnpm demo:cover
      - run: pnpm demo:mint
      - run: pnpm demo:payee
      - run: pnpm demo:climb
      - run: pnpm demo:born
      - run: pnpm demo:reach
      - run: pnpm demo:year
      - run: pnpm demo:fuse
      - run: pnpm demo:sku
      - run: pnpm demo:priced
      - run: pnpm demo:party
      - run: pnpm demo:cash
      - run: pnpm demo:stale
      - run: pnpm demo:chain
      - run: pnpm demo:arrow
      - run: pnpm demo:wallet
      - run: pnpm demo:name
      - run: pnpm demo:pane
      - run: pnpm demo:subject
      - run: pnpm demo:paper
      - run: pnpm demo:mix
      - run: pnpm demo:rung
      - run: pnpm demo:grade
      - run: pnpm demo:cradle
