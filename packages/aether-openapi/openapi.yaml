openapi: 3.1.0
info:
  title: Aether Agent Economic Runtime
  version: 0.96.0
  description: |
    Machine-first HTTP face of the same command bus as MCP.
    402 responses carry PAYMENT-REQUIRED. Submits carry PAYMENT-SIGNATURE.
    All amounts are integer minor units. Rail is sim:aether-1 only.
servers:
  - url: http://127.0.0.1:8787
paths:
  /v1/identities:
    post:
      operationId: identityRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAgent"
      responses:
        "200": { description: Agent created. Command bus allow, not HTTP 201 Created. }
  /v1/kya/attest:
    post:
      operationId: kyaAttest
      responses:
        "200": { description: Handshake issued. Pins a genesis iss_ issuer object. Shape-only. Credentials never enter evaluate(). }
        "422": { description: Policy deny }
  /v1/kya/revoke:
    post:
      operationId: kyaRevoke
      responses:
        "200": { description: Handshake revoked. Cascades. }
        "422": { description: Policy deny }
  /v1/kya:
    get:
      operationId: kyaSnapshot
      responses:
        "200": { description: Graph view. Genesis issuers are shape-only. Edges include derived live | expired | revoked. }
  /v1/circuit/reset:
    post:
      operationId: circuitReset
      responses:
        "200": { description: Daily fuse reset. Mandate budgets unchanged. }
        "422": { description: Policy deny }
  /v1/agents/{id}/freeze:
    post:
      operationId: identityFreeze
      responses:
        "200": { description: Agent frozen to L0 }
        "422": { description: Policy deny }
  /v1/agents/{id}/unfreeze:
    post:
      operationId: identityUnfreeze
      responses:
        "200": { description: Freeze lifted. Counts as a kill-switch test. }
        "422": { description: Policy deny }
  /v1/mandates/intent:
    post:
      operationId: mandateIssueIntent
      responses:
        "200": { description: Signed intent. Command bus allow, not HTTP 201 Created. }
        "422": { description: Policy deny }
  /v1/mandates/cart:
    post:
      operationId: mandateIssueCart
      responses:
        "200": { description: Signed cart. Command bus allow, not HTTP 201 Created. }
  /v1/mandates/payment:
    post:
      operationId: mandateIssuePayment
      responses:
        "200": { description: Signed payment mandate. Command bus allow, not HTTP 201 Created. }
  /v1/rfqs:
    post:
      operationId: marketRfq
      responses:
        "200": { description: RFQ created. Command bus allow, not HTTP 201 Created. }
  /v1/quotes:
    post:
      operationId: marketQuote
      responses:
        "200": { description: Quote created. Command bus allow, not HTTP 201 Created. }
  /v1/hires:
    post:
      operationId: hireCreate
      responses:
        "200": { description: Hire offered. Command bus allow, not HTTP 201 Created. }
        "422": { description: Policy deny }
  /v1/hires/{id}/accept:
    post:
      operationId: hireAccept
      responses:
        "200": { description: Hire accepted }
  /v1/hires/{id}/deliver:
    post:
      operationId: hireDeliver
      responses:
        "200": { description: Work marked delivered }
        "422": { description: Policy deny }
  /v1/hires/{id}/release:
    post:
      operationId: hireRelease
      responses:
        "200": { description: Escrow released to the seller }
        "422": { description: Policy deny }
  /v1/hires/{id}/fund:
    post:
      operationId: hireFund
      responses:
        "200": { description: Escrow funded }
        "422": { description: Policy deny or escalate }
  /v1/hires/{id}/refund:
    post:
      operationId: hireRefund
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string }
                idempotencyKey: { type: string }
      responses:
        "200": { description: Escrow returned to buyer. Mandate spend restored. Circuit stays sticky. }
        "422": { description: Policy deny. Illegal hire transition is hire.state, not HTTP 409. }
  /v1/fx/settle:
    post:
      operationId: marketFxSettle
      responses:
        "200": { description: FX window settled }
        "422": { description: Policy deny }
  /v1/ledger/transfers:
    post:
      operationId: ledgerTransfer
      responses:
        "200": { description: Treasury book transfer }
        "422": { description: Policy deny }
  /v1/payments/require:
    post:
      operationId: envelopeRequire
      responses:
        "402":
          description: Payment required
          headers:
            PAYMENT-REQUIRED:
              schema: { type: string }
              description: Base64 JSON PaymentRequired
  /v1/payments/submit:
    post:
      operationId: envelopeSubmit
      parameters:
        - in: header
          name: PAYMENT-SIGNATURE
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Settled
          headers:
            PAYMENT-RESPONSE:
              schema: { type: string }
        "422": { description: Policy deny. Nonce reuse is idempotency.nonce, not HTTP 409. }
  /v1/approvals/{id}/resolve:
    post:
      operationId: approvalResolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { enum: [approved, rejected] }
      responses:
        "200": { description: Resolved and command replayed if approved }
  /v1/agents/{id}/autonomy:
    post:
      operationId: ladderSet
      responses:
        "200": { description: Level changed }
        "422": { description: Illegal rung skip }
  /v1/accounts/{id}:
    get:
      operationId: ledgerBalances
      responses:
        "200": { description: Named book. Same command as MCP aether_ledger_balances. System speaker. Writes POLICY_DECISION. Not ops-human. }
        "422": { description: ledger.known_account for a missing book. }
  /v1/receipts/{id}:
    get:
      operationId: receiptGet
      responses:
        "200": { description: One receipt. Same command as MCP aether_receipt_get. System speaker. Writes POLICY_DECISION. Not ops-human. }
        "422": { description: receipt.known for a missing receipt. }
  /v1/demo/sprint-procurement:
    post:
      operationId: demoSprintProcurement
      responses:
        "200": { description: Sprint Procurement TAP report. Conformance, not a storefront. }
        "500": { description: Assertions failed }
  /v1/demo/night-watch:
    post:
      operationId: demoNightWatch
      responses:
        "200": { description: Night Watch TAP report. Standing mandate, KYA, circuit breaker. }
        "500": { description: Assertions failed }
  /v1/demo/sub-hire:
    post:
      operationId: demoSubHire
      responses:
        "200": { description: Nested-slip TAP report }
        "500": { description: Assertions failed }
  /v1/demo/clearing:
    post:
      operationId: demoClearingWindow
      responses:
        "200": { description: Clearing-window TAP report. Bilateral credit, settlement photo, not a second payment. }
        "500": { description: Assertions failed }
  /v1/demo/refund:
    post:
      operationId: demoRefundUnwind
      responses:
        "200": { description: Refund TAP report. Unwind funded escrow; quote stays spent; circuit stays sticky. }
        "500": { description: Assertions failed }
  /v1/demo/replay:
    post:
      operationId: demoReplayOnce
      responses:
        "200": { description: Replay TAP report. A retry of an allow is not a second spend. }
        "500": { description: Assertions failed }
  /v1/demo/nonce:
    post:
      operationId: demoEnvelopeNonce
      responses:
        "200": { description: Envelope-nonce TAP report. A payment nonce is one-shot; a leftover nonce on a transfer is not. }
        "500": { description: Assertions failed }
  /v1/demo/deny:
    post:
      operationId: demoDenyCache
      responses:
        "200": { description: Deny-cache TAP report. A deny is never a cached success. }
        "500": { description: Assertions failed }
  /v1/demo/recurrence:
    post:
      operationId: demoRecurrence
      responses:
        "200": { description: Recurrence TAP report. A one-slot cadence is not an open checkbook. }
        "500": { description: Assertions failed }
  /v1/demo/calendar:
    post:
      operationId: demoCalendar
      responses:
        "200": { description: Calendar TAP report. A closed calendar is not a freeze on funded work. }
        "500": { description: Assertions failed }
  /v1/demo/slot:
    post:
      operationId: demoSlot
      responses:
        "200": { description: Slot TAP report. A refund does not restore a cadence slot. }
        "500": { description: Assertions failed }
  /v1/demo/daily:
    post:
      operationId: demoDaily
      responses:
        "200": { description: Daily TAP report. A cadence is a gap, not a burst. }
        "500": { description: Assertions failed }
  /v1/demo/cart:
    post:
      operationId: demoCart
      responses:
        "200": { description: Cart occupancy TAP report. Occupancy is a bind, not a field on fund. }
        "500": { description: Assertions failed }
  /v1/demo/velocity:
    post:
      operationId: demoVelocity
      responses:
        "200": { description: Velocity TAP report. A hot hour is not a freeze on funded work. }
        "500": { description: Assertions failed }
  /v1/demo/door:
    post:
      operationId: demoDoor
      responses:
        "200": { description: Operator-door TAP report. The public kernel is not a hosted checkout. PROTOCOL.hosted stays false. }
        "500": { description: Assertions failed }
  /v1/demo/match:
    post:
      operationId: demoMatch
      responses:
        "200": { description: Cart-match TAP report. A cheaper cart is not a discount. Escrow moves the hire price. }
        "500": { description: Assertions failed }
  /v1/demo/room:
    post:
      operationId: demoRoom
      responses:
        "200": { description: Closed-room TAP report. A named guest list is a closed RFQ, not a bulletin board. }
        "500": { description: Assertions failed }
  /v1/demo/conversion:
    post:
      operationId: demoConversion
      responses:
        "200": { description: Conversion TAP report. An FX window is not a hire. Settle it. }
        "500": { description: Assertions failed }
  /v1/demo/pair:
    post:
      operationId: demoPair
      responses:
        "200": { description: Unique-live TAP report. A second live hop is not a tighter grant. }
        "500": { description: Assertions failed }
  /v1/demo/band:
    post:
      operationId: demoBand
      responses:
        "200": { description: Spread TAP report. A 200bps band is not decoration. }
        "500": { description: Assertions failed }
  /v1/demo/nest:
    post:
      operationId: demoNest
      responses:
        "200": { description: Nest TAP report. A nested hop does not outlive its parent. }
        "500": { description: Assertions failed }
  /v1/demo/heir:
    post:
      operationId: demoHeir
      responses:
        "200": { description: Heir TAP report. A dead parent is not a parent. }
        "500": { description: Assertions failed }
  /v1/demo/stock:
    post:
      operationId: demoStock
      responses:
        "200": { description: Stock TAP report. Empty MM USDC is not a missing maker. }
        "500": { description: Assertions failed }
  /v1/demo/purse:
    post:
      operationId: demoPurse
      responses:
        "200": { description: Purse TAP report. A budget is not an item cap. }
        "500": { description: Assertions failed }
  /v1/demo/seat:
    post:
      operationId: demoSeat
      responses:
        "200": { description: Seat TAP report. One subscriber is one row. }
        "500": { description: Assertions failed }
  /v1/demo/cover:
    post:
      operationId: demoCover
      responses:
        "200": { description: Cover TAP report. A parent envelope is not a child's leftover. }
        "500": { description: Assertions failed }
  /v1/demo/mint:
    post:
      operationId: demoMint
      responses:
        "200": { description: Mint TAP report. A transfer is not a mint. }
        "500": { description: Assertions failed }
  /v1/demo/payee:
    post:
      operationId: demoPayee
      responses:
        "200": { description: Payee TAP report. A listed payee is not any registered vendor. }
        "500": { description: Assertions failed }
  /v1/demo/climb:
    post:
      operationId: demoClimb
      responses:
        "200": { description: Climb TAP report. A climb is not a wider handshake. }
        "500": { description: Assertions failed }
  /v1/demo/born:
    post:
      operationId: demoBorn
      responses:
        "200": { description: Born TAP report. An FX window cannot be born dead. }
        "500": { description: Assertions failed }
  /v1/demo/reach:
    post:
      operationId: demoReach
      responses:
        "200": { description: Reach TAP report. A window that opens after the slip dies is not a window. }
        "500": { description: Assertions failed }
  /v1/demo/year:
    post:
      operationId: demoYear
      responses:
        "200": { description: Year TAP report. A handshake cannot outlive one year. }
        "500": { description: Assertions failed }
  /v1/demo/fuse:
    post:
      operationId: demoFuse
      responses:
        "200": { description: Fuse TAP report. A daily fuse is not a freeze on funded work. }
        "500": { description: Assertions failed }
  /v1/demo/sku:
    post:
      operationId: demoSku
      responses:
        "200": { description: SKU TAP report. A listed SKU is not any catalog good. }
        "500": { description: Assertions failed }
  /v1/demo/priced:
    post:
      operationId: demoPriced
      responses:
        "200": { description: Priced TAP report. A listed SKU is only priced in a currency the catalog names. }
        "500": { description: Assertions failed }
  /v1/demo/party:
    post:
      operationId: demoParty
      responses:
        "200": { description: Party TAP report. The other side of the table is not a party. }
        "500": { description: Assertions failed }
  /v1/demo/cash:
    post:
      operationId: demoCash
      responses:
        "200": { description: Cash TAP report. Empty cash is not a negative book. }
        "500": { description: Assertions failed }
  /v1/demo/stale:
    post:
      operationId: demoStale
      responses:
        "200": { description: Stale TAP report. A stale quote is not a hire. }
        "500": { description: Assertions failed }
  /v1/protocol:
    get:
      operationId: protocolCard
      responses:
        "200": { description: Pin-able aether.protocol.1 host card. liveMoney false. evaluateLlm false. hosted false on this public kernel. }
  /.well-known/aether.json:
    get:
      operationId: wellKnownHostCard
      responses:
        "200": { description: Same pin as GET /v1/protocol. Machine discovery. }
  /.well-known/agent-card.json:
    get:
      operationId: discoveryCard
      responses:
        "200": { description: This runtime's discovery card. Not an A2A JSON-RPC server. }
  /v1/host/card:
    post:
      operationId: hostCard
      responses:
        "200": { description: Same pin via the command bus. System may read it. }
  /v1/host/subscribe:
    post:
      operationId: hostSubscribe
      responses:
        "200": { description: Hosted operator recorded a unique subscriber against a live human-issued intent. }
        "422": { description: host.not_hosted on this public kernel; hosted also names mandate.known_intent, mandate.not_expired, host.human_authority, host.unique_subscriber. GitHub is not a checkout. }
  /v1/host/invoice:
    post:
      operationId: hostInvoice
      responses:
        "200": { description: Recorded that a human paid this hosted operator off-band (invoice or Stripe). Not a Command. Not a spend gate. }
        "401": { description: Named speaker must sign. }
        "402": { description: Not used here — unpaid commands are 402 host.unpaid at the command door. }
        "422": { description: Public kernel does not invoice. Only human_operator or treasury on a hosted instance. }
  /v1/catalog:
    get:
      operationId: marketCatalog
      responses:
        "200": { description: SKUs that may be hired. Not a storefront. }
  /v1/audit:
    get:
      operationId: auditQuery
      parameters:
        - in: query
          name: subject
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200": { description: Notary lines for one subject. Does not mutate. }
  /v1/commands:
    get:
      operationId: commandSchemas
      responses:
        "200": { description: JSON Schema for every CommandType body. Not a dispatcher. }
    post:
      operationId: commandDispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, description: "A CommandType. Unknown or omitted is command.malformed (400)." }
                actor: { type: string }
      responses:
        "200": { description: Command allowed. Same bus as MCP. }
        "202": { description: Escalated to a grown-up. }
        "400": { description: command.malformed (unknown type, or a body the kernel will not read). }
        "402": { description: envelope.require }
        "422": { description: Policy deny }
  /v1/objects/{id}:
    get:
      operationId: inspect
      responses:
        "200": { description: One object by id or alias. An intent includes derived live | expired | funded. A child whose parent died is expired even if its own exp still lives. A cart includes derived live | expired | bound. A payment includes derived live | expired | funded. A payment whose parent cart died is expired even if its own exp still lives. A hire includes derived live | expired | funded. An offered hire whose slip died is expired. Funded wins. A host subscription includes derived live | expired. A row whose slip died is expired, not live enrollment. An iss_ issuer is a genesis catalog row (adapter shape, live false). A dlg_ hop pins that issuer and includes derived live | expired | revoked. }
        "404": { description: Unknown id }
  /v1/hires/{id}:
    get:
      operationId: hireGet
      responses:
        "200": { description: Hire contract. Includes derived live | expired | funded. The store stays raw (state only). }
        "404": { description: Unknown hire }
  /v1/clearing/windows:
    post:
      operationId: clearingSettleWindow
      responses:
        "200": { description: Settlement window archived. Not a second payment. }
  /v1/snapshot:
    get:
      operationId: snapshot
      responses:
        "200": { description: Runtime snapshot. Host subscriptions include derived live | expired. }
  /v1/audit/verify:
    get:
      operationId: auditVerifyGet
      responses:
        "200": { description: Chain ok or first failure. Same command as POST. System speaker. Writes POLICY_DECISION and AUDIT_VERIFY. Not a silent peek. }
    post:
      operationId: auditVerify
      responses:
        "200": { description: Chain ok or first failure. Same command as GET. Auditor, treasury, human_operator, and system may verify. }
        "422": { description: actor.role_capability for a vendor. }
  /openapi.yaml:
    get:
      operationId: openapiYaml
      responses:
        "200": { description: This OpenAPI document as YAML. Not a local filesystem path. }
  /openapi.json:
    get:
      operationId: openapi
      responses:
        "200": { description: Same YAML document in { format: yaml, document }. Not a path on the operator laptop. }
components:
  schemas:
    RegisterAgent:
      type: object
      required: [displayName, role]
      properties:
        displayName: { type: string }
        role:
          enum: [treasury, procurement, data_vendor, compute_vendor, market_maker, auditor, human_operator]
        autonomyLevel: { type: integer, minimum: 0, maximum: 5 }
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
